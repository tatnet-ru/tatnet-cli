name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Право на OIDC-токен нужно задаче npm для provenance-аттестации;
  # вызываемый workflow не может получить больше, чем даёт вызывающий.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Пакеты npm собираются из артефактов, которые только что выложил релиз,
  # поэтому строго после него.
  npm:
    needs: release
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
