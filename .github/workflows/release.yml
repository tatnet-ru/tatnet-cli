name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.19.0"
        required: true
        type: string

permissions:
  contents: write
  # Право на OIDC-токен нужно задаче npm для provenance-аттестации;
  # вызываемый workflow не может получить больше, чем даёт вызывающий.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v0.19.0"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify existing tag target
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$actual_sha" = "$tag_sha"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

  # Пакеты npm собираются из артефактов, которые только что выложил релиз,
  # поэтому строго после него.
  npm:
    needs: release
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
