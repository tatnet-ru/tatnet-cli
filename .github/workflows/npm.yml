name: npm

# Отдельно от релиза намеренно: пакеты собираются из ОПУБЛИКОВАННЫХ
# артефактов, поэтому их можно пересобрать и выложить для любой прошлой
# версии, не выпуская новый тег.
#
# ⚠ Доверенный издатель npm настроен на `release.yml` — реестр проверяет
# ВЫЗЫВАЮЩИЙ workflow, а не тот, где стоит команда публикации. Поэтому при
# ручном запуске (workflow_dispatch) OIDC не сработает: вызывающим окажется
# сам npm.yml. Такой запуск публикует токеном, тегированный релиз — через OIDC.
#
# ⚠ Триггера `release: published` здесь быть НЕ МОЖЕТ: релиз создаёт
# goreleaser штатным GITHUB_TOKEN, а события от него по устройству Actions
# не запускают другие workflow. Такой триггер молча не сработал бы ни разу.
# Поэтому вызов — из release.yml через workflow_call, плюс ручной запуск.
on:
  workflow_call:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.2"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.2"
        required: true
        type: string

permissions:
  contents: read
  # Нужно для provenance: npm подписывает связь «тарболл ← этот прогон ←
  # этот коммит публичного репозитория», и страница пакета показывает
  # происхождение. Это и есть ответ на «что там внутри бинарника».
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Доверенная публикация (OIDC) требует npm >= 11.5.1, а Node 22 приносит
      # npm 10.x — со старым публикация молча пошла бы токеном, и доверенный
      # издатель остался бы настройкой, которая ни разу не сработала.
      # Версия печатается, чтобы это было видно в логе, а не подразумевалось.
      - name: npm нужной версии
        run: |
          npm install -g npm@latest
          echo "node $(node -v), npm $(npm -v)"

      - name: Версия
        id: v
        run: |
          tag="${{ inputs.tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "версия: ${tag#v}"

      - name: Сборка пакетов
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-npm.sh "${{ steps.v.outputs.version }}"

      # Замер до публикации: пакет, который не запускается, публиковать незачем.
      - name: Проверка запуском
        run: |
          set -euo pipefail
          mkdir -p npm/pack
          cd npm/dist
          main=$(npm pack ./tatnet --silent --pack-destination ../pack)
          plat=$(npm pack ./plat-linux-x64 --silent --pack-destination ../pack)
          mkdir -p ../pack/smoke && cd ../pack/smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund "../$plat" "../$main"
          out=$(./node_modules/.bin/tatnet --version)
          echo "$out"
          case "$out" in
            *"${{ steps.v.outputs.version }}"*) echo "версия совпала" ;;
            *) echo "бинарник отдал не ту версию" >&2; exit 1 ;;
          esac
          ./node_modules/.bin/tatnet api --list ssh-keys > /dev/null
          echo "вшитый контракт читается"

      # Чем пойдёт публикация — печатается, а не подразумевается. Основной
      # путь теперь OIDC: доверенный издатель настроен на все семь пакетов и
      # проверен замером (в реестре у 0.1.7 стоит trustedPublisher, у 0.1.6 —
      # имя пользователя). Токен остался необязательным запасным путём.
      #
      # ⚠ Раньше здесь публикация ПРОПУСКАЛАСЬ без токена. С момента, как
      # заработал OIDC, это стало ложью: удаление секрета тихо оставило бы
      # релизы без пакета при зелёном прогоне.
      - name: Способ аутентификации
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "токен задан — будет запасным путём, если OIDC не сработает"
          else
            echo "токена нет — публикация пойдёт только через доверенного издателя"
          fi
          echo "ручной запуск (workflow_dispatch) под OIDC НЕ подходит:"
          echo "  реестр проверяет вызывающий workflow, а связь заведена на release.yml"

      - name: Публикация
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail

          # Уже опубликованное пропускается, а не роняет прогон: после
          # частичного отказа повтор обязан доходить до конца, иначе
          # выбраться из полупубликации можно только руками.
          # Признак «уже опубликовано» берётся из ОТВЕТА реестра на саму
          # публикацию, а не из предварительного npm view: view не видит
          # приватный пакет (токен без прав на организацию), возвращает 404,
          # и пропуск не срабатывает — публикация упирается в «cannot publish
          # over the previously published versions».
          publish() {
            local dir="$1" name out status
            name=$(node -p "require('./$dir/package.json').name")
            set +e
            out=$( (cd "$dir" && npm publish --access public --provenance) 2>&1 )
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "$out"
              # Пауза между публикациями: за релиз уходит семь похожих имён,
              # и очередь без задержки реестр принимает за спам.
              sleep 20
              return 0
            fi
            if printf '%s' "$out" | grep -q "cannot publish over the previously published versions"; then
              echo "уже в реестре, пропускаю: $name@$VERSION"
              return 0
            fi
            echo "$out" >&2
            return "$status"
          }

          # Платформенные первыми: главный пакет на них ссылается точной
          # версией, обратный порядок оставил бы в реестре нерабочий tatnet.
          # Косая черта в маске — только каталоги: иначе сюда попал бы
          # любой .tgz, оказавшийся рядом, и node не нашёл бы в нём манифест.
          for p in npm/dist/plat-*/; do
            publish "${p%/}"
          done
          publish npm/dist/tatnet

      # Отдельная проверка АНОНИМНЫМ запросом: лог публикации уже один раз
      # сказал «успех» о пакетах, которых снаружи не было видно. Верить надо
      # тому, что увидит устанавливающий, а не тому, что напечатал publish.
      - name: Доступность снаружи
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          fail=0
          for name in tatnet @tatnet/cli-darwin-arm64 @tatnet/cli-darwin-x64 \
                      @tatnet/cli-linux-arm64 @tatnet/cli-linux-x64 \
                      @tatnet/cli-win32-arm64 @tatnet/cli-win32-x64; do
            # Адрес КОНКРЕТНОЙ версии, а не пакета: у снятого с публикации
            # пакета остаётся надгробие — документ с пустым versions, который
            # отдаётся с кодом 200. Проверка «документ есть» подтвердила бы
            # доступность того, чего уже нет.
            url="https://registry.npmjs.org/$(printf '%s' "$name" | sed 's|/|%2F|')/$VERSION"
            # Свежесозданный пакет расходится по раздаче не мгновенно:
            # первые минуты анонимный запрос честно отдаёт 404. Поэтому
            # проверка ждёт, а не выносит приговор с первой попытки.
            code=000
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              [ "$code" = "200" ] && break
              sleep 30
            done
            if [ "$code" = "200" ]; then
              echo "  видно всем: $name"
            else
              echo "  НЕ ВИДНО ($code): $name"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "пакеты опубликованы, но снаружи недоступны" >&2; exit 1; }

      # always(), иначе при отказе публикации сводка пустая — а объяснить
      # нужно именно отказ.
      - name: Итог
        if: always()
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            {
              echo "### Публикация в npm не прошла"
              echo
              echo "Частая причина — токен без обхода двухфакторной проверки:"
              echo '`403 ... granular access token with bypass 2fa enabled is required`.'
              echo
              echo "Нужен **granular access token** на npmjs.com с включённым"
              echo "обходом 2FA. Для ПЕРВОЙ публикации его область должна быть"
              echo "«All packages» — пакетов с такими именами в реестре ещё нет,"
              echo "и по имени область не выдаётся."
              echo
              echo "Порядок защищает от полупубликации: платформенные пакеты"
              echo "уходят раньше главного, поэтому нерабочего \`tatnet\` в"
              echo "реестре не появится. Повтор прогона безопасен — уже"
              echo "опубликованные версии пропускаются."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Опубликовано в npm: tatnet@${{ steps.v.outputs.version }}"
              echo
              echo '```'
              echo 'npx tatnet --help'
              echo '```'
              echo
              echo "Чем именно опубликовано, видно в реестре — \`_npmUser\`"
              echo "у версии: доверенный издатель отмечается как"
              echo "\`GitHub Actions\` с полем \`trustedPublisher\`, публикация"
              echo "токеном — именем владельца."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
