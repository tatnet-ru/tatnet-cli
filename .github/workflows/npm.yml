name: npm

# Отдельно от релиза намеренно: пакеты собираются из ОПУБЛИКОВАННЫХ
# артефактов, поэтому их можно пересобрать и выложить для любой прошлой
# версии, не выпуская новый тег.
#
# ⚠ Триггера `release: published` здесь быть НЕ МОЖЕТ: релиз создаёт
# goreleaser штатным GITHUB_TOKEN, а события от него по устройству Actions
# не запускают другие workflow. Такой триггер молча не сработал бы ни разу.
# Поэтому вызов — из release.yml через workflow_call, плюс ручной запуск.
on:
  workflow_call:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.2"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Версия
        id: v
        run: |
          tag="${{ inputs.tag }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "версия: ${tag#v}"

      - name: Сборка пакетов
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-npm.sh "${{ steps.v.outputs.version }}"

      # Замер до публикации: пакет, который не запускается, публиковать незачем.
      - name: Проверка запуском
        run: |
          set -euo pipefail
          mkdir -p npm/pack
          cd npm/dist
          main=$(npm pack ./tatnet --silent --pack-destination ../pack)
          plat=$(npm pack ./plat-linux-x64 --silent --pack-destination ../pack)
          mkdir -p ../pack/smoke && cd ../pack/smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund "../$plat" "../$main"
          out=$(./node_modules/.bin/tatnet --version)
          echo "$out"
          case "$out" in
            *"${{ steps.v.outputs.version }}"*) echo "версия совпала" ;;
            *) echo "бинарник отдал не ту версию" >&2; exit 1 ;;
          esac
          ./node_modules/.bin/tatnet api --list ssh-keys > /dev/null
          echo "вшитый контракт читается"

      - name: Есть ли токен npm
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Публикация в npm пропущена::Секрет NPM_TOKEN не задан. Пакеты собраны и проверены, но в реестр не отправлены. Добавьте токен: gh secret set NPM_TOKEN --repo tatnet-ru/tatnet-cli — и перезапустите этот workflow с нужным тегом."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Публикация
        if: steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail

          # Уже опубликованное пропускается, а не роняет прогон: после
          # частичного отказа повтор обязан доходить до конца, иначе
          # выбраться из полупубликации можно только руками.
          # Признак «уже опубликовано» берётся из ОТВЕТА реестра на саму
          # публикацию, а не из предварительного npm view: view не видит
          # приватный пакет (токен без прав на организацию), возвращает 404,
          # и пропуск не срабатывает — публикация упирается в «cannot publish
          # over the previously published versions».
          publish() {
            local dir="$1" name out status
            name=$(node -p "require('./$dir/package.json').name")
            set +e
            out=$( (cd "$dir" && npm publish --access public) 2>&1 )
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "$out"
              # Пауза между публикациями: за релиз уходит семь похожих имён,
              # и очередь без задержки реестр принимает за спам.
              sleep 20
              return 0
            fi
            if printf '%s' "$out" | grep -q "cannot publish over the previously published versions"; then
              echo "уже в реестре, пропускаю: $name@$VERSION"
              return 0
            fi
            echo "$out" >&2
            return "$status"
          }

          # Платформенные первыми: главный пакет на них ссылается точной
          # версией, обратный порядок оставил бы в реестре нерабочий tatnet.
          # Косая черта в маске — только каталоги: иначе сюда попал бы
          # любой .tgz, оказавшийся рядом, и node не нашёл бы в нём манифест.
          for p in npm/dist/plat-*/; do
            publish "${p%/}"
          done
          publish npm/dist/tatnet

          # Видимость выставляется отдельно и явно: при первой публикации
          # пакета в скоуп организации --access public не гарантирует
          # публичность — пакеты легли приватными, и лог при этом рапортовал
          # «public access».
          for p in npm/dist/plat-*/; do
            name=$(node -p "require('./${p%/}/package.json').name")
            npm access set status=public "$name"
          done

      # Отдельная проверка АНОНИМНЫМ запросом: лог публикации уже один раз
      # сказал «успех» о пакетах, которых снаружи не было видно. Верить надо
      # тому, что увидит устанавливающий, а не тому, что напечатал publish.
      - name: Доступность снаружи
        if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          fail=0
          for name in tatnet @tatnet/cli-darwin-arm64 @tatnet/cli-darwin-x64 \
                      @tatnet/cli-linux-arm64 @tatnet/cli-linux-x64 \
                      @tatnet/cli-win32-arm64 @tatnet/cli-win32-x64; do
            url="https://registry.npmjs.org/$(printf '%s' "$name" | sed 's|/|%2F|')"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  видно всем: $name"
            else
              echo "  НЕ ВИДНО ($code): $name"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "пакеты опубликованы, но снаружи недоступны" >&2; exit 1; }

      # always(), иначе при отказе публикации сводка пустая — а объяснить
      # нужно именно отказ.
      - name: Итог
        if: always()
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            {
              echo "### Публикация в npm не прошла"
              echo
              echo "Частая причина — токен без обхода двухфакторной проверки:"
              echo '`403 ... granular access token with bypass 2fa enabled is required`.'
              echo
              echo "Нужен **granular access token** на npmjs.com с включённым"
              echo "обходом 2FA. Для ПЕРВОЙ публикации его область должна быть"
              echo "«All packages» — пакетов с такими именами в реестре ещё нет,"
              echo "и по имени область не выдаётся."
              echo
              echo "Порядок защищает от полупубликации: платформенные пакеты"
              echo "уходят раньше главного, поэтому нерабочего \`tatnet\` в"
              echo "реестре не появится. Повтор прогона безопасен — уже"
              echo "опубликованные версии пропускаются."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.token.outputs.present }}" = "true" ]; then
            echo "### Опубликовано в npm: tatnet@${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'npx tatnet --help' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### В npm НЕ опубликовано" >> "$GITHUB_STEP_SUMMARY"
            echo "Пакеты собраны и проверены запуском, но секрета \`NPM_TOKEN\` нет." >> "$GITHUB_STEP_SUMMARY"
          fi
