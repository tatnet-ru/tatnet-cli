name: deprecate

# Ручная операция: помечает устаревшими версии СТРОГО НИЖЕ указанной — во
# всех семи пакетах сразу. Нужна при каждой уборке старых версий, поэтому
# оставлена в репозитории, а не выброшена после первого прогона.
#
# Почему это в CI, а не с машины: npm требует второй фактор на любую запись,
# а аккаунт защищён аппаратным ключом — кода из приложения для `--otp` может
# не быть вовсе. Секрет NPM_TOKEN обходит 2FA, поэтому операция выполнима
# здесь и только здесь.
#
# Deprecate обратим: пустое сообщение снимает пометку.
on:
  workflow_dispatch:
    inputs:
      below:
        description: "Пометить всё строго ниже этой версии (например 0.1.6)"
        required: true
        type: string
      message:
        description: "Текст пометки"
        required: true
        default: "Версия устарела — ставьте последнюю: npx tatnet@latest"
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Пометить устаревшими
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BELOW: ${{ inputs.below }}
          MSG: ${{ inputs.message }}
        run: |
          set -euo pipefail

          # Падать закрыто и с объяснением. Доверенный издатель даёт права на
          # ПУБЛИКАЦИЮ, а не на управление пакетом, поэтому OIDC здесь не
          # поможет и без токена операция невозможна в принципе. Голый 403
          # от npm об этом не скажет.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error title=Нет токена npm::Пометка устаревшими требует токен: доверенный издатель (OIDC) разрешает публикацию, но не управление пакетом. Заведите временный granular access token с обходом 2FA на npmjs.com, положите его — gh secret set NPM_TOKEN --repo tatnet-ru/tatnet-cli — запустите этот прогон и УДАЛИТЕ секрет обратно. Постоянно держать его в репозитории незачем: релизы идут по OIDC."
            exit 1
          fi
          for p in tatnet @tatnet/cli-darwin-arm64 @tatnet/cli-darwin-x64 \
                   @tatnet/cli-linux-arm64 @tatnet/cli-linux-x64 \
                   @tatnet/cli-win32-arm64 @tatnet/cli-win32-x64; do
            echo "── $p@<$BELOW"
            npm deprecate "$p@<$BELOW" "$MSG"
          done

      - name: Проверка снаружи
        env:
          BELOW: ${{ inputs.below }}
        run: |
          set -euo pipefail
          sleep 20
          fail=0
          for p in tatnet @tatnet/cli-linux-x64; do
            enc=$(printf '%s' "$p" | sed 's|/|%2F|')
            echo "── $p"
            curl -s --max-time 20 "https://registry.npmjs.org/$enc" | node -e '
              let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                const j=JSON.parse(d), below=process.env.BELOW;
                for (const [v,m] of Object.entries(j.versions)) {
                  const mark = m.deprecated ? "устарела" : "актуальна";
                  console.log("   ", v, "→", mark);
                }
              });'
          done
